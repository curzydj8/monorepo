# =============================================================================
# docker-compose.yml — 本地 / 小规模生产一键部署
# 用法：在 deploy/ 目录下执行 `docker compose up -d --build`
# 架构：web(nginx:80->8080) -> backend(node:4000)，SQLite 文件持久化在 ./data
# =============================================================================

name: monorepo

services:
  backend:
    build:
      context: ..                  # 仓库根目录（npm workspaces 需要完整上下文）
      dockerfile: deploy/Dockerfile.backend
    container_name: monorepo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # SQLite 文件落在 /data（见 volumes 挂载），容器重建数据不丢
      DATABASE_URL: "file:/data/app.db"
      # 生产务必替换：在 deploy/.env 中设置 JWT_SECRET=...（见下方注释）
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    volumes:
      - ./data:/data
    expose:
      - "4000"                     # 仅内部网络可见，对外走 web 的 /api 代理
    healthcheck:
      # 依赖后端实现 GET /api/health 返回 200（契约）
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: /api         # 前端走同域 /api，由 nginx 代理到 backend
    container_name: monorepo-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy  # 后端健康才启动前端
    networks:
      - app

networks:
  app:
    driver: bridge

